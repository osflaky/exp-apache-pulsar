name: Pulsar CI
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ 
    github.event_name == 'workflow_dispatch' && 
    github.event.inputs.jdk_major_version || '' }}
  cancel-in-progress: true

env:
  CI_ENABLE_SSH: ${{ vars.CI_ENABLE_SSH }}
  # defines the retention period for the intermediate build artifacts needed for rerunning a failed build job
  # it's possible to rerun individual failed jobs when the build artifacts are available
  # if the artifacts have already been expired, the complete workflow can be rerun by closing and reopening the PR or by rebasing the PR
  ARTIFACT_RETENTION_DAYS: 3
  JDK_DISTRIBUTION: corretto

# Do not depend on the repository or enterprise default token permissions.
permissions:
  contents: read

jobs:
  preconditions:
    permissions:
      contents: read
      pull-requests: read # List changed files and check whether the PR is ready.
      actions: write # Cancel scheduled runs in forks.
    name: Preconditions
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check_changes.outputs.docs_only }}
      changed_tests: ${{ steps.changes.outputs.tests_files }}
      jdk_major_version: ${{ steps.jdk_major_version.outputs.jdk_major_version 
        }}
      java_non_tests: ${{ steps.changes.outputs.java_non_tests }}
      netty_leak_detection: ${{ 
        steps.netty_leak_detection.outputs.netty_leak_detection }}
    steps:
    - name: Cancel scheduled jobs in forks by default
      if: ${{ github.repository != 'apache/pulsar' && github.event_name == 
        'schedule' }}
      uses: actions/github-script@v8
      with:
        script: |
          await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId});
          process.exit(1);

    - name: Select JDK major version
      id: jdk_major_version
      run: |
        # use JDK 21 for the scheduled build with cron expression '0 6 * * *'
        if [[ "${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' && 'true' || 'false' }}" == "true" ]]; then
          echo "jdk_major_version=21" >> $GITHUB_OUTPUT
          exit 0
        fi
        # use JDK 25 for build unless overridden with workflow_dispatch input
        echo "jdk_major_version=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.jdk_major_version || '25'}}" >> $GITHUB_OUTPUT

    - name: checkout
      uses: actions/checkout@v6

    - name: Check ASF action allowlist
      if: ${{ (github.event.pull_request.base.repo.owner.login || 
        github.repository_owner) == 'apache' }}
      uses: apache/infrastructure-actions/allowlist-check@main
      with:
        scan-glob: '.github/**/*.y*ml'

    - name: Detect changed files
      if: ${{ github.event_name == 'pull_request' }}
      id: changes
      uses: apache/pulsar-test-infra/paths-filter@master
      with:
        filters: .github/changes-filter.yaml
        list-files: csv

    - name: Check changed files
      if: ${{ github.event_name == 'pull_request' }}
      id: check_changes
      run: |
        if [[ "${GITHUB_EVENT_NAME}" != "schedule" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
          echo "docs_only=${{ fromJSON(steps.changes.outputs.all_count) == fromJSON(steps.changes.outputs.docs_count) && fromJSON(steps.changes.outputs.docs_count) > 0 }}" >> $GITHUB_OUTPUT
        else
          echo docs_only=false >> $GITHUB_OUTPUT
        fi

    - name: Check if the PR is ready for running CI
      if: ${{ steps.check_changes.outputs.docs_only != 'true' && 
        github.repository == 'apache/pulsar' && github.event_name == 
        'pull_request' }}
      uses: ./.github/actions/check-pr-ready-to-test

    - name: Set Netty leak detection mode
      id: netty_leak_detection
      run: |
        echo "netty_leak_detection=${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.netty_leak_detection || 'report'
        }}" >> $GITHUB_OUTPUT

  build-and-license-check:
    needs: preconditions
    name: Build and License check [ubuntu-24.04--x64]
    env:
      JOB_NAME: Build and License check
      CI_JDK_MAJOR_VERSION: ${{ needs.preconditions.outputs.jdk_major_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ needs.preconditions.outputs.docs_only != 'true' }}
    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: Tune Runner VM
      uses: ./.github/actions/tune-runner-vm

    - name: Setup ssh access to build runner VM
        # ssh access is enabled for builds in own forks
      if: ${{ github.repository != 'apache/pulsar' && github.event_name == 
        'pull_request' }}
      uses: ./.github/actions/ssh-access
      continue-on-error: true
      with:
        limit-access-to-actor: true

    - name: Set up JDK ${{ env.CI_JDK_MAJOR_VERSION }}
      uses: actions/setup-java@v5
      with:
        distribution: ${{ env.JDK_DISTRIBUTION }}
        java-version: ${{ env.CI_JDK_MAJOR_VERSION }}

    - name: Setup Gradle
      uses: ./.github/actions/setup-gradle
      with:
        develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        cache-read-only: false

    - name: Build, check licenses and code style
      run: >-
        ./gradlew assemble rat spotlessCheck checkstyleMain checkstyleTest
        --no-configuration-cache

    - name: Check binary licenses
      run: ./gradlew checkBinaryLicense --no-configuration-cache

    - name: Check that project's public libraries can be published to a Maven 
        repository
      run: ./gradlew publishAllPublicationsToLocalDeployRepository

    - name: Check API/SPI publication dependency closure with a custom group
        # Validate generated POMs and Gradle metadata, including the BOM, without uploading artifacts.
      run: >-
        ./gradlew validateApiSpiPublication
        -PpublishApiAndSpiOnly=true -Pgroup=myorg.pulsar

    - name: Upload Gradle reports
      uses: actions/upload-artifact@v4
      if: ${{ !success() }}
      with:
        name: gradle-reports-build-and-license-check
        path: |
          **/build/reports/
        retention-days: 7
        if-no-files-found: ignore

    - name: Save build outputs for test jobs
      run: |
        # Tar up compiled classes, resources, and distribution archives so test jobs
        # don't need to recompile. Distribution tarballs are needed for Docker image builds.
        find . \( -path '*/build/classes/*' -o -path '*/build/generated/*' -o -path '*/build/resources/*' \
          -o -path '*/build/libs/*' -o -path '*/build/tmp/jar/*' -o -path '*/build/distributions/*' \) -print \
          | tar cf /tmp/gradle-build-outputs.tar --files-from=-

    - name: Upload build outputs
      uses: actions/upload-artifact@v7
      with:
        name: gradle-build-outputs
        path: /tmp/gradle-build-outputs.tar
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        compression-level: 1

    - name: Wait for ssh connection when build fails
        # ssh access is enabled for builds in own forks
      uses: ./.github/actions/ssh-access
      if: ${{ failure() && github.repository != 'apache/pulsar' && 
        github.event_name == 'pull_request' }}
      continue-on-error: true
      with:
        action: wait


